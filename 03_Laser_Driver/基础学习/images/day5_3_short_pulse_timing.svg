<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 232" width="680" height="232" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="232" fill="#FFFFFF" rx="8"/>
  <line x1="180" y1="16" x2="180" y2="212" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="210" y1="16" x2="210" y2="212" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="430" y1="16" x2="430" y2="212" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="3 3"/>
  <line x1="460" y1="16" x2="460" y2="212" stroke="#CBD5E1" stroke-width="1.1" stroke-dasharray="3 3"/>

  <text x="112" y="46" text-anchor="end" font-family="sans-serif" font-size="13" fill="#0F172A">IN+ (原脉冲)</text>
  <line x1="124" y1="62" x2="620" y2="62" stroke="#64748B" stroke-width="1.1"/>
  <polyline points="124,62 180,62 180,26 320,26 320,62 430,62 430,26 570,26 570,62 616,62" fill="none" stroke="#0284C7" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="250" y="20" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">普通宽脉冲（如 90 ns）</text>

  <text x="112" y="116" text-anchor="end" font-family="sans-serif" font-size="13" fill="#0F172A">IN- (延迟脉冲)</text>
  <line x1="124" y1="132" x2="620" y2="132" stroke="#64748B" stroke-width="1.1"/>
  <polyline points="124,132 210,132 210,96 350,96 350,132 460,132 460,96 600,96 600,132 616,132" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linejoin="round"/>
  <text x="280" y="90" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#475569">经 RC 延迟 Δt（如 1.5 ns）</text>

  <text x="112" y="186" text-anchor="end" font-family="sans-serif" font-size="13" fill="#0F172A">OUT (最终输出)</text>
  <line x1="124" y1="202" x2="620" y2="202" stroke="#64748B" stroke-width="1.1"/>
  <polyline points="124,202 180,202 180,164 210,164 210,202 430,202 430,164 460,164 460,202 616,202" fill="none" stroke="#0D9488" stroke-width="2.4" stroke-linejoin="round"/>
  <text x="195" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F766E">1.5 ns 窄脉冲！</text>
  <text x="445" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F766E">脉宽 = Δt</text>
</svg>