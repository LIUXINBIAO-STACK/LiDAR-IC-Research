<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 320" width="680" height="320" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="320" fill="#FFFFFF" rx="8"/>
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="7.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 3 1.5 L 7.5 5 L 3 8.5" fill="none" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-m-rev" viewBox="0 0 10 10" refX="2.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 7 1.5 L 2.5 5 L 7 8.5" fill="none" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="74" y1="32" x2="74" y2="258" stroke="#475569" stroke-width="1.25"/>
  <line x1="74" y1="258" x2="628" y2="258" stroke="#475569" stroke-width="1.25"/>
  <text x="66" y="40" text-anchor="end" font-family="sans-serif" font-size="12" fill="#475569">幅值</text>
  <text x="634" y="262" font-family="monospace" font-size="12" fill="#475569">t</text>

  <!-- Reference Levels: 100% (y=108), 90% (y=123), 50% (y=183), 10% (y=243), 0% (y=258) -->
  <line x1="74" y1="108" x2="616" y2="108" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="74" y1="123" x2="616" y2="123" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="74" y1="183" x2="616" y2="183" stroke="#CBD5E1" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="74" y1="243" x2="616" y2="243" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3"/>

  <text x="66" y="112" text-anchor="end" font-family="monospace" font-size="11.5" fill="#0F172A">100%</text>
  <text x="66" y="127" text-anchor="end" font-family="monospace" font-size="11" fill="#64748B">90%</text>
  <text x="66" y="187" text-anchor="end" font-family="monospace" font-size="11.5" fill="#0F172A">50%</text>
  <text x="66" y="247" text-anchor="end" font-family="monospace" font-size="11" fill="#64748B">10%</text>
  <text x="66" y="262" text-anchor="end" font-family="monospace" font-size="11" fill="#64748B">0%</text>

  <!-- Jitter Ghost Edges (dashed light blue) -->
  <path d="M 122 258 L 154 258 C 170 258 188 120 202 108" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 146 258 L 178 258 C 194 258 212 120 226 108" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Main Pulse Waveform with Overshoot + Ringing -->
  <path d="M 80 258 L 166 258 C 180 258 198 118 212 108 C 222 100 228 62 242 62 C 256 62 264 128 278 128 C 292 128 302 96 318 96 C 334 96 346 112 364 108 L 414 108 C 430 108 446 244 464 258 C 476 268 486 276 498 276 C 510 276 520 248 534 248 C 548 248 558 262 574 258 L 616 258" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Vertical Guides for tr, tf, FWHM -->
  <!-- tr: 10% at x=174, 90% at x=204 -->
  <line x1="174" y1="243" x2="174" y2="284" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="204" y1="123" x2="204" y2="284" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="175" y1="280" x2="203" y2="280" stroke="#0F172A" stroke-width="1.2" marker-start="url(#arr-m-rev)" marker-end="url(#arr-m)"/>
  <text x="189" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F172A">上升时间 t_r</text>

  <!-- tf: 90% at x=424, 10% at x=456 -->
  <line x1="424" y1="123" x2="424" y2="284" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="456" y1="243" x2="456" y2="284" stroke="#64748B" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="425" y1="280" x2="455" y2="280" stroke="#0F172A" stroke-width="1.2" marker-start="url(#arr-m-rev)" marker-end="url(#arr-m)"/>
  <text x="440" y="298" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F172A">下降时间 t_f</text>

  <!-- FWHM (50% to 50%): x=190 to x=440 -->
  <circle cx="190" cy="183" r="3.5" fill="#0D9488"/>
  <circle cx="440" cy="183" r="3.5" fill="#0D9488"/>
  <line x1="194" y1="183" x2="436" y2="183" stroke="#0D9488" stroke-width="1.8" marker-start="url(#arr-m-rev)" marker-end="url(#arr-m)"/>
  <rect x="266" y="170" width="100" height="22" rx="4" fill="#FFFFFF"/>
  <text x="316" y="185" text-anchor="middle" font-family="sans-serif" font-size="12.5" fill="#0F766E">脉冲宽度 FWHM</text>

  <!-- Overshoot Annotation -->
  <circle cx="242" cy="62" r="3.5" fill="#D97706"/>
  <line x1="242" y1="62" x2="242" y2="108" stroke="#D97706" stroke-width="1.5"/>
  <text x="252" y="54" font-family="sans-serif" font-size="12.5" fill="#B45309">过冲 Overshoot（超出 100% 稳态）</text>

  <!-- Ringing Annotation -->
  <text x="348" y="84" font-family="sans-serif" font-size="12" fill="#B45309">顶/底部振铃 Ringing</text>
  <text x="536" y="294" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#B45309">负向振铃（需反并联二极管钳位）</text>

  <!-- Jitter Annotation -->
  <text x="130" y="156" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0369A1">抖动 Jitter</text>
  <text x="130" y="172" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569">边沿随机晃动</text>
</svg>